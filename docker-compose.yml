services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092" # доступ с хоста (EXTERNAL)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ocr-requests --partitions 2 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic ocr-results --partitions 2 --replication-factor 1

  folder_watcher:
    build:
      context: ./folder_watcher
    container_name: folder_watcher
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      Watcher__WatchFolder: /watch
      Watcher__ResultFolder: /results
      Watcher__Transport: Kafka
      Watcher__Kafka__BootstrapServers: kafka:19092
      Watcher__Kafka__RequestTopic: ocr-requests
      Watcher__Kafka__ResultTopic: ocr-results
      Watcher__Kafka__GroupId: folder-watcher
    volumes:
      - C:/A77X7/tmp/watch:/watch
      - C:/A77X7/tmp/results:/results

  tesseract:
    build:
      context: ./tesseract
    container_name: tesseract
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:19092
      Kafka__RequestTopic: ocr-requests
      Kafka__ResultTopic: ocr-results
      Kafka__GroupId: tesseract
    volumes:
      - C:/A77X7/tmp/watch:/watch
      - C:/A77X7/tmp/results:/results
    ports:
      - "8081:8080" # HTTP /ocr

volumes:
  kafka-data:
