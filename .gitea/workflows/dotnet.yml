name: .NET 10 Multi-Project CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 1. Восстанавливаем и собираем ВСЁ решение целиком
    # (Это проверит синтаксис всех проектов сразу)
    - name: Restore & Build Solution
      run: |
        dotnet restore
        dotnet build --configuration Release --no-restore

    # 2. Запускаем тесты ТОЛЬКО для тестового проекта
    - name: Run Unit Tests
      run: dotnet test ./tesseract.tests/tesseract.tests.csproj --configuration Release --no-build

    # 3. Публикуем (Publish) конкретные проекты в разные папки артефактов
    # (Например, компилируем WebApi в готовый наборов файлов для деплоя)
    - name: Publish tesseract
      run: dotnet publish ./tesseract/tesseract.csproj --configuration Release --output ./publish/tesseract --no-build

    - name: Publish ocr
      run: dotnet publish ./ocr/ocr.csproj --configuration Release --output ./publish/ocr --no-build

    - name: Publish folder_watcher
      run: dotnet publish ./folder_watcher/folder_watcher.csproj --configuration Release --output ./publish/folder_watcher --no-build

    - name: Publish auth
      run: dotnet publish ./auth/auth.csproj --configuration Release --output ./publish/auth --no-build

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dotnet10-publish
        path: ./publish/

  build-and-push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine registry host
      run: |
        REGISTRY="${{ vars.REGISTRY_HOST }}"
        if [ -z "$REGISTRY" ]; then
          REGISTRY="$(echo '${{ github.server_url }}' | sed -E 's|^https?://||')"
        fi
        OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
        SHA="$(echo '${{ github.sha }}' | cut -c1-8)"
        echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
        echo "OWNER=$OWNER" >> "$GITHUB_ENV"
        echo "SHA=$SHA" >> "$GITHUB_ENV"

    - name: Login to Gitea Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push tesseract
      uses: docker/build-push-action@v6
      with:
        context: ./tesseract
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.OWNER }}/tesseract:latest
          ${{ env.REGISTRY }}/${{ env.OWNER }}/tesseract:${{ env.SHA }}

    - name: Build and push folder_watcher
      uses: docker/build-push-action@v6
      with:
        context: ./folder_watcher
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.OWNER }}/folder_watcher:latest
          ${{ env.REGISTRY }}/${{ env.OWNER }}/folder_watcher:${{ env.SHA }}